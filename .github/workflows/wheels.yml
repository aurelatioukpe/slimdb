name: wheels

# Builds the slimdb wheel for the Phase 3 DoD matrix (spec §12):
#   Linux x86_64, macOS ARM64/x86_64, Windows x86_64
# `pip install slimdb` from the wheel requires no local compilation.
#
# Publish to PyPI is a separate step (needs a token); the job builds and
# smoke-tests the wheels, then uploads them as artifacts.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # manylinux x86_64
          - macos-13            # x86_64
          - macos-14            # arm64
          - windows-latest      # x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: bindings/python
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"

      - name: Smoke-test the wheel (install + run the demo)
        run: |
          pip install --force-reinstall wheelhouse/*.whl
          python -m unittest discover -s bindings/python/tests -v
          python bindings/python/examples/demo.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

[package]
name = "slimdb-crash-tester"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kill -9 crash test harness for SlimDB (writer + runner binaries)."

[dependencies]
slimdb-core = { path = "../../core" }

[[bin]]
name = "slimdb-writer"
